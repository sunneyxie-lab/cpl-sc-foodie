name: raw_fastq_align_test
namespace: test_workflows
scope: test
description: |
  Checks one sample's complete raw_fastq_align artifact contract, decoded raw
  inputs, ordered statistics and mate-associated FastQC content, and an untagged
  first-pass paired BAM. Does not require an index or coordinate sort.
  Per-sample provenance is not distributed. Original/CBQ/final gzip checks run
  during generation; the workflow controller validates completion, payload hashes
  and common dependencies before submitting tasks.
requirements:
  commands: [python3, samtools]
authors:
  - __merge__: /src/_authors/zhang_zhen.yaml
    roles: [author, maintainer]
argument_groups:
  - name: Input
    arguments:
      - name: --id
        type: string
        required: true
        description: Sample ID associated with every input and output.
      - name: --read1
        type: file
        required: true
        description: Original regional raw R1 fixture.
      - name: --read2
        type: file
        required: true
        description: Original regional raw R2 fixture.
      - name: --output_bam
        type: file
        required: true
        description: First-pass, untagged producer BAM.
      - name: --output_bismark_report
        type: file
        required: true
        description: Producer paired-end alignment report.
      - name: --output_raw_stats
        type: file
        required: true
        description: SeqKit table in raw R1/R2 order.
      - name: --output_extracted_trimmed_stats
        type: file
        required: true
        description: SeqKit table in extracted R1/R2 then trimmed R1/R2 order.
      - name: --output_raw_fastqc_html
        type: file
        multiple: true
        required: true
        description: Readable raw FastQC HTML reports, R1 then R2.
      - name: --output_raw_fastqc_zip
        type: file
        multiple: true
        required: true
        description: Readable raw FastQC ZIP reports, R1 then R2.
      - name: --output_extracted_fastqc_html
        type: file
        multiple: true
        required: true
        description: Readable extracted FastQC HTML reports, R1 then R2.
      - name: --output_extracted_fastqc_zip
        type: file
        multiple: true
        required: true
        description: Readable extracted FastQC ZIP reports, R1 then R2.
      - name: --output_trimmed_fastqc_html
        type: file
        multiple: true
        required: true
        description: Readable trimmed FastQC HTML reports, R1 then R2.
      - name: --output_trimmed_fastqc_zip
        type: file
        multiple: true
        required: true
        description: Readable trimmed FastQC ZIP reports, R1 then R2.
resources:
  - type: bash_script
    path: script.sh
  - path: check.py
engines:
  - type: docker
    image: quay.io/biocontainers/samtools:1.19.2--h50ea8bc_1
    setup:
      - type: docker
        # The pinned samtools image is a bookworm busybox runtime without apt.
        # Copy only Python and its needed shared libraries, preserving samtools.
        copy:
          - --from=python:3.12-slim-bookworm /usr/local/bin/python3.12 /usr/local/bin/python3
          - --from=python:3.12-slim-bookworm /usr/local/lib/python3.12 /usr/local/lib/python3.12
          - --from=python:3.12-slim-bookworm /usr/local/lib/libpython3.12.so.1.0 /usr/local/lib/libpython3.12.so.1.0
          - --from=python:3.12-slim-bookworm /lib/x86_64-linux-gnu/libz.so.1 /lib/x86_64-linux-gnu/libz.so.1
          - --from=python:3.12-slim-bookworm /lib/x86_64-linux-gnu/libbz2.so.1.0 /lib/x86_64-linux-gnu/libbz2.so.1.0
          - --from=python:3.12-slim-bookworm /lib/x86_64-linux-gnu/liblzma.so.5 /lib/x86_64-linux-gnu/liblzma.so.5
          - --from=python:3.12-slim-bookworm /lib/x86_64-linux-gnu/libcrypto.so.3 /lib/x86_64-linux-gnu/libcrypto.so.3
          - --from=python:3.12-slim-bookworm /lib/x86_64-linux-gnu/libssl.so.3 /lib/x86_64-linux-gnu/libssl.so.3
        run: >-
          ldconfig &&
          samtools --version | python3 -c 'import sys; print(sys.stdin.readline().strip())' > /var/software_versions.txt &&
          python3 --version >> /var/software_versions.txt
runners:
  - type: executable
  - type: nextflow
    directives:
      label: [singlecpu, lowmem]
