    type: "local"
- name: "bismark/bismark_align"
  repository:
    type: "local"
- name: "fastqc"
  repository:
    type: "vsh"
    repo: "biobox"
    tag: "v0.5.0"
repositories:
- type: "vsh"
  name: "biobox"
  repo: "biobox"
  tag: "v0.5.0"
