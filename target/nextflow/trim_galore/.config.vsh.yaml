name: "trim_galore"
version: "integration_build"
authors:
- name: "Zhang Zhen"
  roles:
  - "author"
  - "maintainer"
  info:
    links:
      email: "zhangzhen@cpl.ac.cn"
argument_groups:
- name: "Input"
  arguments:
  - type: "file"
    name: "--input"
    description: "Exactly two extracted gzip FASTQs, ordered R1 then R2."
    info: null
    example:
    - "extracted_R1.fastq.gz"
    - "extracted_R2.fastq.gz"
    must_exist: true
    create_parent: true
    required: true
    direction: "input"
    multiple: true
    multiple_sep: ";"
- name: "Output"
  arguments:
  - type: "file"
    name: "--output_read1"
    description: "Trimmed gzip R1 FASTQ."
    info: null
    example:
    - "trimmed_R1.fastq.gz"
    must_exist: true
    create_parent: true
    required: true
    direction: "output"
    multiple: false
    multiple_sep: ";"
  - type: "file"
    name: "--output_read2"
    description: "Trimmed gzip R2 FASTQ."
    info: null
    example:
    - "trimmed_R2.fastq.gz"
    must_exist: true
    create_parent: true
    required: true
    direction: "output"
    multiple: false
    multiple_sep: ";"
  - type: "file"
    name: "--fastqc_html"
    description: "One HTML output template with exactly one `*`, indexed 0 (R1) and\
      \ 1 (R2)."
    info: null
    example:
    - "trimmed_fastqc.*.html"
    must_exist: true
    create_parent: true
    required: true
    direction: "output"
    multiple: true
    multiple_sep: ";"
  - type: "file"
    name: "--fastqc_zip"
    description: "One ZIP output template with exactly one `*`, indexed 0 (R1) and\
      \ 1 (R2)."
    info: null
    example:
    - "trimmed_fastqc.*.zip"
    must_exist: true
    create_parent: true
    required: true
    direction: "output"
    multiple: true
    multiple_sep: ";"
resources:
- type: "bash_script"
  path: "script.sh"
  is_executable: true
- type: "file"
  path: "select_legacy_adapter.py"
- type: "file"
  path: "nextflow_labels.config"
  dest: "nextflow_labels.config"
description: "Trim extracted gzip FASTQ pairs with Rust Trim Galore 2.3.0 and bundled\n\
  FastQC. Fixed FOODIE settings use legacy three-adapter selection from R1,\nquality\
  \ 20, stringency 2, error rate 0.1 and no automatic poly-G trimming.\nOutput report\
  \ lists contain R1 then R2; small-RNA selection retains its\npreset-specific length\
  \ cutoff and R2 adapter. Barcode-bearing headers are\nnot rewritten. Runtime image\
  \ digests belong in execution evidence.\n"
info: null
status: "enabled"
scope:
  image: "public"
  target: "public"
requirements:
  commands:
  - "trim_galore"
  - "python3"
  - "gzip"
  - "mktemp"
  - "mkdir"
  - "dirname"
  - "mv"
repositories:
- type: "vsh"
  name: "biobox"
  repo: "biobox"
  tag: "v0.5.0"
keywords:
- "fastq"
- "trimming"
- "quality-control"
license: "GPL-3.0"
links:
  repository: "https://github.com/FelixKrueger/TrimGalore"
  docker_registry: "ghcr.io"
runners:
- type: "executable"
  id: "executable"
  docker_setup_strategy: "ifneedbepullelsecachedbuild"
- type: "nextflow"
  id: "nextflow"
  directives:
    label:
    - "lowcpu"
    - "lowmem"
    tag: "$id"
  auto:
    simplifyInput: true
    simplifyOutput: false
    transcript: false
    publish: false
  config:
    labels:
      mem1gb: "memory = 1000000000.B"
      mem2gb: "memory = 2000000000.B"
      mem5gb: "memory = 5000000000.B"
      mem10gb: "memory = 10000000000.B"
      mem20gb: "memory = 20000000000.B"
      mem50gb: "memory = 50000000000.B"
      mem100gb: "memory = 100000000000.B"
      mem200gb: "memory = 200000000000.B"
      mem500gb: "memory = 500000000000.B"
      mem1tb: "memory = 1000000000000.B"
      mem2tb: "memory = 2000000000000.B"
      mem5tb: "memory = 5000000000000.B"
      mem10tb: "memory = 10000000000000.B"
      mem20tb: "memory = 20000000000000.B"
      mem50tb: "memory = 50000000000000.B"
      mem100tb: "memory = 100000000000000.B"
      mem200tb: "memory = 200000000000000.B"
      mem500tb: "memory = 500000000000000.B"
      mem1gib: "memory = 1073741824.B"
      mem2gib: "memory = 2147483648.B"
      mem4gib: "memory = 4294967296.B"
      mem8gib: "memory = 8589934592.B"
      mem16gib: "memory = 17179869184.B"
      mem32gib: "memory = 34359738368.B"
      mem64gib: "memory = 68719476736.B"
      mem128gib: "memory = 137438953472.B"
      mem256gib: "memory = 274877906944.B"
      mem512gib: "memory = 549755813888.B"
      mem1tib: "memory = 1099511627776.B"
      mem2tib: "memory = 2199023255552.B"
      mem4tib: "memory = 4398046511104.B"
      mem8tib: "memory = 8796093022208.B"
      mem16tib: "memory = 17592186044416.B"
      mem32tib: "memory = 35184372088832.B"
      mem64tib: "memory = 70368744177664.B"
      mem128tib: "memory = 140737488355328.B"
      mem256tib: "memory = 281474976710656.B"
      mem512tib: "memory = 562949953421312.B"
      cpu1: "cpus = 1"
      cpu2: "cpus = 2"
      cpu5: "cpus = 5"
      cpu10: "cpus = 10"
      cpu20: "cpus = 20"
      cpu50: "cpus = 50"
      cpu100: "cpus = 100"
      cpu200: "cpus = 200"
      cpu500: "cpus = 500"
      cpu1000: "cpus = 1000"
    script:
    - "includeConfig(\"nextflow_labels.config\")"
  debug: false
  container: "docker"
engines:
- type: "docker"
  id: "docker"
  image: "ghcr.io/felixkrueger/trimgalore:v2.3.0"
  namespace_separator: "/"
  setup:
  - type: "apt"
    packages:
    - "python3"
    interactive: false
  - type: "docker"
    run:
    - "trim_galore --version > /var/software_versions.txt && python3 --version >>\
      \ /var/software_versions.txt"
  entrypoint: []
  cmd: null
build_info:
  config: "src/components/trim_galore/config.vsh.yaml"
  runner: "nextflow"
  engine: "docker"
  output: "target/nextflow/trim_galore"
  executable: "target/nextflow/trim_galore/main.nf"
  viash_version: "0.9.7"
  git_commit: "4c4aa95226868907729af1d7ecb6ffbc5c649690"
  git_remote: "https://github.com/sunneyxie-lab/cpl-sc-foodie"
package_config:
  name: "cpl-sc-foodie"
  version: "integration_build"
  info: null
  repositories:
  - type: "vsh"
    name: "biobox"
    repo: "biobox"
    tag: "v0.5.0"
  viash_version: "0.9.7"
  source: "src"
  target: "target"
  config_mods:
  - ".resources += {path: '/src/workflows/utils/labels.config', dest: 'nextflow_labels.config'}\n\
    .runners[.type == 'nextflow'].config.script := 'includeConfig(\"nextflow_labels.config\"\
    )'"
  - ".test_resources := []"
  organization: "sunneyxie-lab"
  links:
    docker_registry: "ghcr.io"
