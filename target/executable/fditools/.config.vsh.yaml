name: "fditools"
version: "main_build"
authors:
- name: "Zhang Zhen"
  roles:
  - "author"
  - "maintainer"
  info:
    links:
      email: "zhangzhen@cpl.ac.cn"
argument_groups:
- name: "Input"
  arguments:
  - type: "file"
    name: "--read1"
    alternatives:
    - "-a"
    description: "Original paired FASTQ, read 1."
    info: null
    must_exist: true
    create_parent: true
    required: true
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "file"
    name: "--read2"
    alternatives:
    - "-b"
    description: "Original paired FASTQ, read 2."
    info: null
    must_exist: true
    create_parent: true
    required: true
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "file"
    name: "--bc_whitelist"
    alternatives:
    - "-w"
    description: "Barcode whitelist passed unchanged to fdi."
    info: null
    must_exist: true
    create_parent: true
    required: true
    direction: "input"
    multiple: false
    multiple_sep: ";"
- name: "Output"
  arguments:
  - type: "file"
    name: "--output_read1"
    alternatives:
    - "-c"
    description: "Extracted read 1 in gzip FASTQ format."
    info: null
    must_exist: true
    create_parent: true
    required: true
    direction: "output"
    multiple: false
    multiple_sep: ";"
  - type: "file"
    name: "--output_read2"
    alternatives:
    - "-d"
    description: "Extracted read 2 in gzip FASTQ format."
    info: null
    must_exist: true
    create_parent: true
    required: true
    direction: "output"
    multiple: false
    multiple_sep: ";"
resources:
- type: "bash_script"
  path: "script.sh"
  is_executable: true
- type: "file"
  path: "nextflow_labels.config"
  dest: "nextflow_labels.config"
description: "Extract FOODIE cell barcodes using fdi 0.1.0 built from the public MIT-licensed\n\
  fditools source tag 0.1.0.\nFixed match length 11, skip length 19 and gzip output.\
  \ Short aliases map\nread1/read2/bc_whitelist/output_read1/output_read2 to -a/-b/-w/-c/-d.\n\
  Barcodes concatenate the two matched halves without a separator.\nMulti-stage Docker\
  \ builds use Rust 1.97.1 and the committed Cargo.lock with --locked.\nOnly the binary\
  \ and license are copied from the builder into the runtime stage.\nBuild with `viash\
  \ build src/components/fditools/config.vsh.yaml --setup cachedbuild`.\nNo release\
  \ credentials or local legacy/ directory are needed for image builds.\nCI publishing\
  \ requires public GHCR image visibility.\nSupports Linux x86-64 with glibc, not\
  \ ARM or musl.\nComponent tests generate synthetic FASTQs and a whitelist; real\
  \ regional data\nis reserved for workflow integration tests.\nReads and writes gzip\
  \ directly at all CPU budgets, using synchronous output\ncompression (-T 1) without\
  \ intermediate plain FASTQs.\n"
info: null
status: "enabled"
scope:
  image: "public"
  target: "public"
requirements:
  commands:
  - "fdi"
  - "mktemp"
  - "mv"
repositories:
- type: "vsh"
  name: "biobox"
  repo: "biobox"
  tag: "v0.5.0"
keywords:
- "foodie"
- "barcode"
- "fastq"
license: "MIT"
links:
  docker_registry: "ghcr.io"
runners:
- type: "executable"
  id: "executable"
  docker_setup_strategy: "ifneedbepullelsecachedbuild"
- type: "nextflow"
  id: "nextflow"
  directives:
    label:
    - "lowcpu"
    - "lowmem"
    tag: "$id"
  auto:
    simplifyInput: true
    simplifyOutput: false
    transcript: false
    publish: false
  config:
    labels:
      mem1gb: "memory = 1000000000.B"
      mem2gb: "memory = 2000000000.B"
      mem5gb: "memory = 5000000000.B"
      mem10gb: "memory = 10000000000.B"
      mem20gb: "memory = 20000000000.B"
      mem50gb: "memory = 50000000000.B"
      mem100gb: "memory = 100000000000.B"
      mem200gb: "memory = 200000000000.B"
      mem500gb: "memory = 500000000000.B"
      mem1tb: "memory = 1000000000000.B"
      mem2tb: "memory = 2000000000000.B"
      mem5tb: "memory = 5000000000000.B"
      mem10tb: "memory = 10000000000000.B"
      mem20tb: "memory = 20000000000000.B"
      mem50tb: "memory = 50000000000000.B"
      mem100tb: "memory = 100000000000000.B"
      mem200tb: "memory = 200000000000000.B"
      mem500tb: "memory = 500000000000000.B"
      mem1gib: "memory = 1073741824.B"
      mem2gib: "memory = 2147483648.B"
      mem4gib: "memory = 4294967296.B"
      mem8gib: "memory = 8589934592.B"
      mem16gib: "memory = 17179869184.B"
      mem32gib: "memory = 34359738368.B"
      mem64gib: "memory = 68719476736.B"
      mem128gib: "memory = 137438953472.B"
      mem256gib: "memory = 274877906944.B"
      mem512gib: "memory = 549755813888.B"
      mem1tib: "memory = 1099511627776.B"
      mem2tib: "memory = 2199023255552.B"
      mem4tib: "memory = 4398046511104.B"
      mem8tib: "memory = 8796093022208.B"
      mem16tib: "memory = 17592186044416.B"
      mem32tib: "memory = 35184372088832.B"
      mem64tib: "memory = 70368744177664.B"
      mem128tib: "memory = 140737488355328.B"
      mem256tib: "memory = 281474976710656.B"
      mem512tib: "memory = 562949953421312.B"
      cpu1: "cpus = 1"
      cpu2: "cpus = 2"
      cpu5: "cpus = 5"
      cpu10: "cpus = 10"
      cpu20: "cpus = 20"
      cpu50: "cpus = 50"
      cpu100: "cpus = 100"
      cpu200: "cpus = 200"
      cpu500: "cpus = 500"
      cpu1000: "cpus = 1000"
    script:
    - "includeConfig(\"nextflow_labels.config\")"
  debug: false
  container: "docker"
engines:
- type: "docker"
  id: "docker"
  image: "debian:bookworm-slim"
  namespace_separator: "/"
  setup:
  - type: "apt"
    packages:
    - "build-essential"
    - "cmake"
    - "libclang-dev"
    - "pkg-config"
    - "libssl-dev"
    - "libbz2-dev"
    - "liblzma-dev"
    - "zlib1g-dev"
    - "xz-utils"
    - "ca-certificates"
    - "curl"
    interactive: false
  - type: "docker"
    run:
    - "set -eu; \\\nfor component in rustc rust-std cargo; do \\\n  curl --fail --location\
      \ --silent --show-error \\\n    \"https://static.rust-lang.org/dist/${component}-1.97.1-x86_64-unknown-linux-gnu.tar.xz\"\
      \ \\\n    --output \"/tmp/${component}.tar.xz\"; \\\ndone; \\\nprintf '%s\\\
      n' \\\n  '9819d0a32d56bd339585319c80260e332779f5541fd66838ab7e016d6c814819 \
      \ /tmp/rustc.tar.xz' \\\n  '1c1e704ae80126b7de34f72ea2825f7fd01736dec20732faed47374b95282fba\
      \  /tmp/rust-std.tar.xz' \\\n  'e1be5f5ff7f7f80ca506fb65770b759edbdc6d303781ed71c5de8ec8a8394779\
      \  /tmp/cargo.tar.xz' | \\\n  sha256sum -c -; \\\nfor component in rustc rust-std\
      \ cargo; do \\\n  tar -xJf \"/tmp/${component}.tar.xz\" -C /tmp; \\\n  \"/tmp/${component}-1.97.1-x86_64-unknown-linux-gnu/install.sh\"\
      \ \\\n    --prefix=/tmp/fditools-rust --disable-ldconfig; \\\ndone; \\\nmkdir\
      \ /tmp/fditools-source; \\\ncurl --fail --location --silent --show-error \\\n\
      \  https://github.com/zhangzhen/fditools/archive/refs/tags/0.1.0.tar.gz \\\n\
      \  --output /tmp/fditools-source.tar.gz; \\\ntar -xzf /tmp/fditools-source.tar.gz\
      \ --strip-components=1 -C /tmp/fditools-source; \\\ncd /tmp/fditools-source;\
      \ \\\nPATH=\"/tmp/fditools-rust/bin:$PATH\" CARGO_HOME=/tmp/fditools-cargo \\\
      \n  cargo build --release --locked; \\\ninstall -Dm 755 target/release/fdi /out/bin/fdi;\
      \ \\\ninstall -Dm 644 LICENSE /out/share/licenses/fditools/LICENSE\nFROM debian:bookworm-slim\
      \ AS runtime"
  - type: "apt"
    packages:
    - "libgcc-s1"
    - "procps"
    interactive: false
  - type: "docker"
    copy:
    - "--from=0 /out/ /usr/local/"
    run:
    - "fdi --version > /var/software_versions.txt"
  test_setup:
  - type: "apt"
    packages:
    - "python3"
    interactive: false
  entrypoint: []
  cmd: null
build_info:
  config: "src/components/fditools/config.vsh.yaml"
  runner: "executable"
  engine: "docker"
  output: "target/executable/fditools"
  executable: "target/executable/fditools/fditools"
  viash_version: "0.9.7"
  git_commit: "d618182468a15e5116741589d447817dfb7f7627"
  git_remote: "https://github.com/sunneyxie-lab/cpl-sc-foodie"
package_config:
  name: "cpl-sc-foodie"
  version: "main_build"
  info: null
  repositories:
  - type: "vsh"
    name: "biobox"
    repo: "biobox"
    tag: "v0.5.0"
  viash_version: "0.9.7"
  source: "src"
  target: "target"
  config_mods:
  - ".resources += {path: '/src/workflows/utils/labels.config', dest: 'nextflow_labels.config'}\n\
    .runners[.type == 'nextflow'].config.script := 'includeConfig(\"nextflow_labels.config\"\
    )'"
  - ".test_resources := []"
  organization: "sunneyxie-lab"
  links:
    docker_registry: "ghcr.io"
