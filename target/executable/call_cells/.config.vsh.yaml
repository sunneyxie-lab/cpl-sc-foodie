name: "call_cells"
version: "main_build"
authors:
- name: "Zhang Zhen"
  roles:
  - "author"
  - "maintainer"
  info:
    links:
      email: "zhangzhen@cpl.ac.cn"
argument_groups:
- name: "Input"
  arguments:
  - type: "file"
    name: "--input"
    description: "`fgumi group` BAM; every record has a `CB` tag, grouped records\
      \ an `MI` tag."
    info: null
    example:
    - "grouped.bam"
    must_exist: true
    create_parent: true
    required: true
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "string"
    name: "--id"
    description: "Sample ID, shown in the QC summary and the plot title."
    info: null
    example:
    - "H0O260120CPL0071F1S_001"
    required: true
    direction: "input"
    multiple: false
    multiple_sep: ";"
- name: "Output"
  arguments:
  - type: "file"
    name: "--output_cell_list"
    description: "Called cells as `barcode<TAB>count`, no header, ascending by count\
      \ then barcode."
    info: null
    example:
    - "cell_list.tsv"
    must_exist: true
    create_parent: true
    required: true
    direction: "output"
    multiple: false
    multiple_sep: ";"
  - type: "file"
    name: "--output_cell_counts"
    description: "Every barcode with its number of distinct `MI` group ids, as\n`barcode<TAB>count`,\
      \ no header, ascending by count then barcode.\n"
    info: null
    example:
    - "cell_counts.tsv"
    must_exist: true
    create_parent: true
    required: true
    direction: "output"
    multiple: false
    multiple_sep: ";"
  - type: "file"
    name: "--output_cell_qc"
    description: "Cell-calling QC summary, a header row plus one data row."
    info: null
    example:
    - "cell_qc.tsv"
    must_exist: true
    create_parent: true
    required: true
    direction: "output"
    multiple: false
    multiple_sep: ";"
  - type: "file"
    name: "--output_knee_plot"
    description: "4-panel knee plot."
    info: null
    example:
    - "knee_plot.png"
    must_exist: true
    create_parent: true
    required: true
    direction: "output"
    multiple: false
    multiple_sep: ";"
- name: "Arguments"
  arguments:
  - type: "integer"
    name: "--drop_lowest"
    description: "Number of lowest-count barcodes dropped before looking for the knee."
    info: null
    default:
    - 1000
    required: false
    min: 0
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "integer"
    name: "--max_cells"
    description: "A knee that keeps this many cells or more counts as failed, and\
      \ the\ntop `--fallback_cells` barcodes are kept instead.\n"
    info: null
    default:
    - 2000
    required: false
    min: 1
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "integer"
    name: "--fallback_cells"
    description: "Number of top barcodes kept when the knee fails (all barcodes if\
      \ fewer)."
    info: null
    default:
    - 1000
    required: false
    min: 1
    direction: "input"
    multiple: false
    multiple_sep: ";"
resources:
- type: "python_script"
  path: "script.py"
  is_executable: true
- type: "file"
  path: "nextflow_labels.config"
  dest: "nextflow_labels.config"
description: "Count distinct `MI` group ids per `CB` cell barcode in an `fgumi group`\
  \ BAM,\ncall cells with a kneedle knee on the sorted counts (falling back to the\
  \ top\nbarcodes when the knee fails), and write the cell list, the per-barcode\n\
  counts, a one-line QC summary and a 4-panel knee plot.\n"
info: null
status: "enabled"
scope:
  image: "public"
  target: "public"
repositories:
- type: "vsh"
  name: "biobox"
  repo: "biobox"
  tag: "v0.5.0"
keywords:
- "cell calling"
- "knee"
- "single cell"
- "bam"
license: "MIT"
links:
  docker_registry: "ghcr.io"
runners:
- type: "executable"
  id: "executable"
  docker_setup_strategy: "ifneedbepullelsecachedbuild"
- type: "nextflow"
  id: "nextflow"
  directives:
    label:
    - "singlecpu"
    - "lowmem"
    tag: "$id"
  auto:
    simplifyInput: true
    simplifyOutput: false
    transcript: false
    publish: false
  config:
    labels:
      mem1gb: "memory = 1000000000.B"
      mem2gb: "memory = 2000000000.B"
      mem5gb: "memory = 5000000000.B"
      mem10gb: "memory = 10000000000.B"
      mem20gb: "memory = 20000000000.B"
      mem50gb: "memory = 50000000000.B"
      mem100gb: "memory = 100000000000.B"
      mem200gb: "memory = 200000000000.B"
      mem500gb: "memory = 500000000000.B"
      mem1tb: "memory = 1000000000000.B"
      mem2tb: "memory = 2000000000000.B"
      mem5tb: "memory = 5000000000000.B"
      mem10tb: "memory = 10000000000000.B"
      mem20tb: "memory = 20000000000000.B"
      mem50tb: "memory = 50000000000000.B"
      mem100tb: "memory = 100000000000000.B"
      mem200tb: "memory = 200000000000000.B"
      mem500tb: "memory = 500000000000000.B"
      mem1gib: "memory = 1073741824.B"
      mem2gib: "memory = 2147483648.B"
      mem4gib: "memory = 4294967296.B"
      mem8gib: "memory = 8589934592.B"
      mem16gib: "memory = 17179869184.B"
      mem32gib: "memory = 34359738368.B"
      mem64gib: "memory = 68719476736.B"
      mem128gib: "memory = 137438953472.B"
      mem256gib: "memory = 274877906944.B"
      mem512gib: "memory = 549755813888.B"
      mem1tib: "memory = 1099511627776.B"
      mem2tib: "memory = 2199023255552.B"
      mem4tib: "memory = 4398046511104.B"
      mem8tib: "memory = 8796093022208.B"
      mem16tib: "memory = 17592186044416.B"
      mem32tib: "memory = 35184372088832.B"
      mem64tib: "memory = 70368744177664.B"
      mem128tib: "memory = 140737488355328.B"
      mem256tib: "memory = 281474976710656.B"
      mem512tib: "memory = 562949953421312.B"
      cpu1: "cpus = 1"
      cpu2: "cpus = 2"
      cpu5: "cpus = 5"
      cpu10: "cpus = 10"
      cpu20: "cpus = 20"
      cpu50: "cpus = 50"
      cpu100: "cpus = 100"
      cpu200: "cpus = 200"
      cpu500: "cpus = 500"
      cpu1000: "cpus = 1000"
    script:
    - "includeConfig(\"nextflow_labels.config\")"
  debug: false
  container: "docker"
engines:
- type: "docker"
  id: "docker"
  image: "python:3.12-slim"
  namespace_separator: "/"
  setup:
  - type: "apt"
    packages:
    - "procps"
    interactive: false
  - type: "python"
    user: false
    packages:
    - "pysam==0.22.1"
    - "numpy==2.1.3"
    - "pandas==2.2.3"
    - "matplotlib==3.9.2"
    - "seaborn==0.13.2"
    - "kneed==0.8.5"
    upgrade: true
  - type: "docker"
    run:
    - "python -c \"import importlib.metadata as m; print('\\n'.join(f'{p}: {m.version(p)}'\
      \ for p in ['pysam', 'numpy', 'pandas', 'matplotlib', 'seaborn', 'kneed']))\"\
      \ > /var/software_versions.txt\n"
  entrypoint: []
  cmd: null
build_info:
  config: "src/components/call_cells/config.vsh.yaml"
  runner: "executable"
  engine: "docker"
  output: "target/executable/call_cells"
  executable: "target/executable/call_cells/call_cells"
  viash_version: "0.9.7"
  git_commit: "5a16f29ba2febd89756b2a7fccf86c70a553e1cc"
  git_remote: "https://github.com/sunneyxie-lab/cpl-sc-foodie"
package_config:
  name: "cpl-sc-foodie"
  version: "main_build"
  info: null
  repositories:
  - type: "vsh"
    name: "biobox"
    repo: "biobox"
    tag: "v0.5.0"
  viash_version: "0.9.7"
  source: "src"
  target: "target"
  config_mods:
  - ".resources += {path: '/src/workflows/utils/labels.config', dest: 'nextflow_labels.config'}\n\
    .runners[.type == 'nextflow'].config.script := 'includeConfig(\"nextflow_labels.config\"\
    )'"
  - ".test_resources := []"
  organization: "sunneyxie-lab"
  links:
    docker_registry: "ghcr.io"
