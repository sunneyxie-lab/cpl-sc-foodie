name: Main build

on:
  push:
    branches: [main]
  workflow_call:
    inputs:
      mode:
        required: true
        type: string
      version:
        required: false
        default: ''
        type: string
    outputs:
      version:
        value: ${{ jobs.deploy.outputs.version }}
      target_branch:
        value: ${{ jobs.deploy.outputs.target_branch }}
      published_sha:
        value: ${{ jobs.deploy.outputs.published_sha }}
      build_attempt:
        value: ${{ jobs.deploy.outputs.build_attempt }}

permissions:
  contents: read

concurrency:
  group: publisher-${{ inputs.mode || 'development' }}
  cancel-in-progress: false

jobs:
  target:
    name: Generate production targets
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.variables.outputs.version }}
      target_branch: ${{ steps.variables.outputs.target_branch }}
      build_attempt: ${{ steps.variables.outputs.build_attempt }}
      components: ${{ steps.components.outputs.matrix }}
    steps:
      - name: Validate publication identity
        id: variables
        env:
          MODE: ${{ inputs.mode }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == pull_request || "$GITHUB_EVENT_NAME" == pull_request_target ]]; then
            echo '::error::Pull requests cannot publish'
            exit 1
          fi
          if [[ -n "$MODE" && "$MODE" != release && "$MODE" != integration ]]; then
            echo '::error::Called publication mode must be release or integration'
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == push && -z "$MODE" ]]; then
            MODE=development
          fi
          case "$MODE" in
            development)
              [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main && -z "$RELEASE_VERSION" ]] || exit 1
              VERSION=main_build
              TARGET_BRANCH=main_build
              ;;
            integration)
              if [[ -n "$RELEASE_VERSION" ]]; then
                echo '::error::Integration builds require an empty version'
                exit 1
              fi
              VERSION=integration_build
              TARGET_BRANCH=integration_build
              ;;
            release)
              if [[ ! "$RELEASE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                echo '::error::Release version must be vX.Y.Z'
                exit 1
              fi
              VERSION="$RELEASE_VERSION"
              TARGET_BRANCH=release
              ;;
            *)
              echo '::error::Called publication mode must be release or integration'
              exit 1
              ;;
          esac
          {
            echo "version=$VERSION"
            echo "target_branch=$TARGET_BRANCH"
            echo "build_attempt=$GITHUB_RUN_ATTEMPT"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: viash-io/viash-actions/setup@v6
        with:
          version: '0.9.7'
      - name: Set generated package version
        env:
          VERSION: ${{ steps.variables.outputs.version }}
        run: yq -i '.version = strenv(VERSION)' _viash.yaml
      - name: Generate production targets without test fixtures
        run: |
          viash ns build --parallel --query '^(?!test_workflows/)' \
            --config_mod '.test_resources := []'
      - name: List production components
        id: components
        run: |
          matrix=$(viash ns list --src src/components --runner executable --engine docker --format json | \
            jq -c '[.[] | select(.scope.image == "public") | {
              name: ([.namespace, .name] | map(select(. != null and . != "")) | join("/")),
              config: .build_info.config,
              executable: (.build_info.output + "/" + .name)
            }]')
          if [[ "$(jq 'length' <<< "$matrix")" == 0 ]]; then
            echo '::error::No production components discovered'
            exit 1
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
      - name: Archive generated targets
        run: tar -czf "$RUNNER_TEMP/build.tar.gz" _viash.yaml target
      - uses: actions/upload-artifact@v4
        with:
          name: build-target
          path: ${{ runner.temp }}/build.tar.gz
          retention-days: 1

  images:
    name: Publish ${{ matrix.component.name }}
    needs: target
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJSON(needs.target.outputs.components) }}
    steps:
      - name: Reject partial publishing retries
        env:
          BUILD_ATTEMPT: ${{ needs.target.outputs.build_attempt }}
        run: |
          if [[ "$BUILD_ATTEMPT" != "$GITHUB_RUN_ATTEMPT" ]]; then
            echo '::error::Stale generated targets. Use Re-run all jobs before publishing.'
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: build-target
          path: ${{ runner.temp }}
      - run: tar -xzf "$RUNNER_TEMP/build.tar.gz"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push production image
        env:
          EXECUTABLE: ${{ matrix.component.executable }}
        run: |
          "$EXECUTABLE" ---engine docker ---setup build ---verbose
          "$EXECUTABLE" ---engine docker ---setup push ---verbose
      - name: Require anonymous image access
        env:
          COMPONENT_NAME: ${{ matrix.component.name }}
          VERSION: ${{ needs.target.outputs.version }}
        run: |
          image="ghcr.io/sunneyxie-lab/cpl-sc-foodie/$COMPONENT_NAME:$VERSION"
          if ! DOCKER_CONFIG="$(mktemp -d)" docker manifest inspect "$image" > /dev/null; then
            echo "::error::Cannot read $image anonymously. Set the package public and grant this repository Actions Write access, then use Re-run all jobs."
            exit 1
          fi

  deploy:
    name: Publish generated branch
    needs: [target, images]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.published.outputs.version }}
      target_branch: ${{ steps.published.outputs.target_branch }}
      published_sha: ${{ steps.published.outputs.published_sha }}
      build_attempt: ${{ steps.published.outputs.build_attempt }}
    steps:
      - name: Reject partial publishing retries
        env:
          BUILD_ATTEMPT: ${{ needs.target.outputs.build_attempt }}
        run: |
          if [[ "$BUILD_ATTEMPT" != "$GITHUB_RUN_ATTEMPT" ]]; then
            echo '::error::Stale generated targets. Use Re-run all jobs before publishing.'
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: build-target
          path: ${{ runner.temp }}
      - name: Stage published project
        run: |
          mkdir published
          tar -xzf "$RUNNER_TEMP/build.tar.gz" -C published
          cp -a src assets resources_test_scripts main.nf nextflow.config README.md CHANGELOG.md published/
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: ${{ needs.target.outputs.target_branch }}
          publish_dir: published
          full_commit_message: 'Build source ${{ github.sha }} version ${{ needs.target.outputs.version }}'
      - name: Record published commit
        id: published
        env:
          TARGET_BRANCH: ${{ needs.target.outputs.target_branch }}
          VERSION: ${{ needs.target.outputs.version }}
          BUILD_ATTEMPT: ${{ needs.target.outputs.build_attempt }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          published_sha=$(git -c "http.extraheader=AUTHORIZATION: basic $auth" \
            ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)
          if [[ -z "$published_sha" ]]; then
            echo '::error::Published branch has no resolvable commit'
            exit 1
          fi
          {
            echo "version=$VERSION"
            echo "target_branch=$TARGET_BRANCH"
            echo "published_sha=$published_sha"
            echo "build_attempt=$BUILD_ATTEMPT"
          } >> "$GITHUB_OUTPUT"
          {
            echo "Branch: $TARGET_BRANCH"
            echo "Version: $VERSION"
            echo "Source SHA: $GITHUB_SHA"
            echo "Generated SHA: $published_sha"
          } >> "$GITHUB_STEP_SUMMARY"
